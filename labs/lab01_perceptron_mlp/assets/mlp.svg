<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" fill="#fdfdfb"/>

  <!-- title -->
  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#111827" font-weight="600">Multi-layer Perceptron (XOR architecture)</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#6b7280">2 inputs → 3 hidden (sigmoid) → 2 outputs</text>

  <!-- layer labels -->
  <text x="130" y="340" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Input layer</text>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Hidden layer</text>
  <text x="590" y="340" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">Output layer</text>

  <!-- Connections drawn first so nodes overlay them -->
  <g stroke="#9ca3af" stroke-width="1">
    <!-- input to hidden -->
    <line x1="155" y1="140" x2="335" y2="120"/>
    <line x1="155" y1="140" x2="335" y2="200"/>
    <line x1="155" y1="140" x2="335" y2="280"/>
    <line x1="155" y1="240" x2="335" y2="120"/>
    <line x1="155" y1="240" x2="335" y2="200"/>
    <line x1="155" y1="240" x2="335" y2="280"/>
    <!-- hidden to output -->
    <line x1="385" y1="120" x2="565" y2="160"/>
    <line x1="385" y1="120" x2="565" y2="240"/>
    <line x1="385" y1="200" x2="565" y2="160"/>
    <line x1="385" y1="200" x2="565" y2="240"/>
    <line x1="385" y1="280" x2="565" y2="160"/>
    <line x1="385" y1="280" x2="565" y2="240"/>
  </g>

  <!-- Input nodes -->
  <g font-size="15" fill="#111827">
    <circle cx="130" cy="140" r="25" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="130" y="146" text-anchor="middle">x₁</text>
    <circle cx="130" cy="240" r="25" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="130" y="246" text-anchor="middle">x₂</text>
  </g>

  <!-- Hidden nodes -->
  <g font-size="14" fill="#0c4a6e">
    <circle cx="360" cy="120" r="25" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="360" y="126" text-anchor="middle">h₁</text>
    <circle cx="360" cy="200" r="25" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="360" y="206" text-anchor="middle">h₂</text>
    <circle cx="360" cy="280" r="25" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="360" y="286" text-anchor="middle">h₃</text>
  </g>

  <!-- Output nodes -->
  <g font-size="14" fill="#14532d">
    <circle cx="590" cy="160" r="25" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="590" y="166" text-anchor="middle">o₁</text>
    <circle cx="590" cy="240" r="25" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="590" y="246" text-anchor="middle">o₂</text>
  </g>

  <!-- Side note about activation -->
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#0369a1" font-style="italic">σ(w·x + b)</text>
</svg>
