<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="380" fill="#fdfdfb"/>

  <!-- inputs -->
  <g font-size="16" fill="#111827">
    <circle cx="80"  cy="70"  r="22" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="80"  y="76"  text-anchor="middle">x₁</text>
    <circle cx="80"  cy="140" r="22" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="80"  y="146" text-anchor="middle">x₂</text>
    <circle cx="80"  cy="210" r="22" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="80"  y="216" text-anchor="middle">x₃</text>
    <circle cx="80"  cy="280" r="22" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="80"  y="286" text-anchor="middle">x₄</text>
    <!-- bias -->
    <circle cx="80"  cy="340" r="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="80"  y="346" text-anchor="middle" fill="#7c2d12">1</text>
  </g>

  <!-- weight labels and lines into summation -->
  <g stroke="#374151" stroke-width="1.4" fill="none">
    <line x1="102" y1="70"  x2="320" y2="200" marker-end="url(#arrow)"/>
    <line x1="102" y1="140" x2="320" y2="200" marker-end="url(#arrow)"/>
    <line x1="102" y1="210" x2="320" y2="200" marker-end="url(#arrow)"/>
    <line x1="102" y1="280" x2="320" y2="200" marker-end="url(#arrow)"/>
    <line x1="102" y1="340" x2="320" y2="200" marker-end="url(#arrow)" stroke="#b45309" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" fill="#1f2937" font-style="italic">
    <text x="175" y="106">w₁</text>
    <text x="190" y="158">w₂</text>
    <text x="190" y="205">w₃</text>
    <text x="190" y="252">w₄</text>
    <text x="175" y="300" fill="#7c2d12">b (bias)</text>
  </g>

  <!-- summation -->
  <circle cx="350" cy="200" r="34" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="350" y="208" text-anchor="middle" font-size="24" fill="#111827">Σ</text>
  <text x="350" y="254" text-anchor="middle" font-size="12" fill="#6b7280">weighted sum</text>

  <!-- step function -->
  <line x1="384" y1="200" x2="460" y2="200" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="422" y="190" text-anchor="middle" font-size="12" fill="#1f2937" font-style="italic">z</text>

  <rect x="460" y="160" width="100" height="80" rx="8" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <!-- mini step inside -->
  <polyline points="475,225 502,225 502,180 545,180" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="475" y1="225" x2="545" y2="225" stroke="#9ca3af" stroke-width="0.8"/>
  <line x1="502" y1="170" x2="502" y2="232" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="510" y="258" text-anchor="middle" font-size="12" fill="#6b7280">step function</text>

  <!-- output -->
  <line x1="560" y1="200" x2="630" y2="200" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="660" cy="200" r="26" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="660" y="206" text-anchor="middle" font-size="16" fill="#14532d">ŷ</text>
  <text x="660" y="252" text-anchor="middle" font-size="12" fill="#6b7280">prediction (0 or 1)</text>

  <!-- title -->
  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#111827" font-weight="600">Single perceptron</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#6b7280">ŷ = step( w·x + b )</text>
</svg>
