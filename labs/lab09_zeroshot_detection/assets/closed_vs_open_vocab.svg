<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#fdfdfb"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Two ways to detect a badger</text>
  <text x="450" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Closed-vocabulary needs training on labelled badgers. Open-vocabulary just needs the word "badger".</text>

  <!-- ===== Row 1: closed-vocabulary (what they built) ===== -->
  <g transform="translate(0, 76)">
    <text x="60" y="0" font-size="13" font-weight="600" fill="#1f2937">Closed-vocabulary — the YOLO26 you trained (Labs 6–8)</text>

    <!-- annotate -->
    <g transform="translate(60, 16)">
      <rect x="0" y="0" width="120" height="90" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.3"/>
      <text x="60" y="30" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">annotate</text>
      <text x="60" y="48" text-anchor="middle" font-size="10" fill="#6b7280">hundreds of</text>
      <text x="60" y="62" text-anchor="middle" font-size="10" fill="#6b7280">labelled boxes</text>
      <text x="60" y="80" text-anchor="middle" font-size="10" fill="#a05a0c">(Lab 6 — hours)</text>
    </g>
    <line x1="186" y1="61" x2="214" y2="61" stroke="#374151" stroke-width="1.3" marker-end="url(#a9)"/>
    <!-- train -->
    <g transform="translate(216, 16)">
      <rect x="0" y="0" width="120" height="90" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.3"/>
      <text x="60" y="34" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">train</text>
      <text x="60" y="52" text-anchor="middle" font-size="10" fill="#6b7280">50 epochs</text>
      <text x="60" y="70" text-anchor="middle" font-size="10" fill="#a05a0c">(Lab 7 — GPU time)</text>
    </g>
    <line x1="342" y1="61" x2="370" y2="61" stroke="#374151" stroke-width="1.3" marker-end="url(#a9)"/>
    <!-- model -->
    <g transform="translate(372, 16)">
      <rect x="0" y="0" width="130" height="90" rx="3" fill="#15161a" stroke="#1f2937" stroke-width="1.3"/>
      <text x="65" y="40" text-anchor="middle" font-size="11" fill="#f6f1e7" font-weight="600">YOLO26x</text>
      <text x="65" y="58" text-anchor="middle" font-size="10" fill="#adb5bd">knows exactly</text>
      <text x="65" y="72" text-anchor="middle" font-size="10" fill="#adb5bd">5 fixed classes</text>
    </g>
    <line x1="508" y1="61" x2="536" y2="61" stroke="#374151" stroke-width="1.3" marker-end="url(#a9)"/>
    <!-- result -->
    <g transform="translate(538, 16)">
      <rect x="0" y="0" width="120" height="90" fill="#cfe6ef" stroke="#1f2937" stroke-width="1.3"/>
      <ellipse cx="55" cy="58" rx="30" ry="17" fill="#3f3a35"/>
      <circle cx="35" cy="50" r="11" fill="#e9e4dc"/>
      <rect x="18" y="36" width="74" height="40" fill="none" stroke="#d6336c" stroke-width="2"/>
      <text x="60" y="86" text-anchor="middle" font-size="9" fill="#6b7280">badger ✓</text>
    </g>
    <text x="730" y="55" font-size="11" fill="#2d6a3f">+ fast, accurate on its</text>
    <text x="730" y="70" font-size="11" fill="#2d6a3f">  domain, runs offline</text>
    <text x="730" y="88" font-size="11" fill="#c0322b">− weeks of data work</text>
  </g>

  <line x1="40" y1="210" x2="860" y2="210" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Row 2: open-vocabulary (zero-shot) ===== -->
  <g transform="translate(0, 232)">
    <text x="60" y="0" font-size="13" font-weight="600" fill="#1f2937">Open-vocabulary — YOLOE-26 zero-shot (Lab 9)</text>

    <!-- prompt -->
    <g transform="translate(60, 16)">
      <rect x="0" y="0" width="190" height="90" rx="3" fill="#fff" stroke="#1f2937" stroke-width="1.3"/>
      <text x="95" y="28" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">just type the words</text>
      <text x="95" y="52" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1c7ed6">["badger", "fox",</text>
      <text x="95" y="68" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1c7ed6"> "deer", ...]</text>
      <text x="95" y="84" text-anchor="middle" font-size="10" fill="#2d6a3f">(seconds — no data, no training)</text>
    </g>
    <line x1="256" y1="61" x2="370" y2="61" stroke="#374151" stroke-width="1.3" marker-end="url(#a9)"/>
    <!-- model -->
    <g transform="translate(372, 16)">
      <rect x="0" y="0" width="130" height="90" rx="3" fill="#15161a" stroke="#1f2937" stroke-width="1.3"/>
      <text x="65" y="36" text-anchor="middle" font-size="11" fill="#f6f1e7" font-weight="600">YOLOE-26</text>
      <text x="65" y="54" text-anchor="middle" font-size="10" fill="#adb5bd">pretrained on</text>
      <text x="65" y="68" text-anchor="middle" font-size="10" fill="#adb5bd">millions of images</text>
      <text x="65" y="82" text-anchor="middle" font-size="9" fill="#74b816">open vocabulary</text>
    </g>
    <line x1="508" y1="61" x2="536" y2="61" stroke="#374151" stroke-width="1.3" marker-end="url(#a9)"/>
    <!-- result -->
    <g transform="translate(538, 16)">
      <rect x="0" y="0" width="120" height="90" fill="#cfe6ef" stroke="#1f2937" stroke-width="1.3"/>
      <ellipse cx="55" cy="58" rx="30" ry="17" fill="#3f3a35"/>
      <circle cx="35" cy="50" r="11" fill="#e9e4dc"/>
      <rect x="16" y="34" width="78" height="44" fill="none" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="60" y="86" text-anchor="middle" font-size="9" fill="#6b7280">badger (zero-shot)</text>
    </g>
    <text x="730" y="48" font-size="11" fill="#2d6a3f">+ no data, no training,</text>
    <text x="730" y="63" font-size="11" fill="#2d6a3f">  any class on demand</text>
    <text x="730" y="81" font-size="11" fill="#c0322b">− often less precise on</text>
    <text x="730" y="96" font-size="11" fill="#c0322b">  a narrow domain</text>
  </g>

  <text x="450" y="448" text-anchor="middle" font-size="12" fill="#495057" font-style="italic">The Lab 9 question: for YOUR problem, which is the right tool — and could you use both?</text>
</svg>
