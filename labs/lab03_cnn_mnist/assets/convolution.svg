<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#fdfdfb"/>

  <!-- ============================== TITLE ============================== -->
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">A 3×3 convolutional kernel sliding over a 5×5 input</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">The kernel multiplies every patch element-wise, sums the products, and writes one output pixel.</text>

  <!-- ============================== STEP 1 ============================== -->
  <g transform="translate(40, 95)">
    <text x="0" y="-8" font-size="13" font-weight="600" fill="#1f2937">Step 1 — kernel at top-left</text>

    <!-- 5x5 input grid -->
    <g font-size="14" fill="#111827" text-anchor="middle">
      <!-- highlighted patch (3x3 top-left) -->
      <rect x="0"  y="0"  width="135" height="135" fill="#fef3c7" stroke="none"/>

      <!-- grid cells -->
      <g stroke="#cbd5e1" stroke-width="1">
        <rect x="0"   y="0"   width="45" height="45" fill="none"/>
        <rect x="45"  y="0"   width="45" height="45" fill="none"/>
        <rect x="90"  y="0"   width="45" height="45" fill="none"/>
        <rect x="135" y="0"   width="45" height="45" fill="none"/>
        <rect x="180" y="0"   width="45" height="45" fill="none"/>

        <rect x="0"   y="45"  width="45" height="45" fill="none"/>
        <rect x="45"  y="45"  width="45" height="45" fill="none"/>
        <rect x="90"  y="45"  width="45" height="45" fill="none"/>
        <rect x="135" y="45"  width="45" height="45" fill="none"/>
        <rect x="180" y="45"  width="45" height="45" fill="none"/>

        <rect x="0"   y="90"  width="45" height="45" fill="none"/>
        <rect x="45"  y="90"  width="45" height="45" fill="none"/>
        <rect x="90"  y="90"  width="45" height="45" fill="none"/>
        <rect x="135" y="90"  width="45" height="45" fill="none"/>
        <rect x="180" y="90"  width="45" height="45" fill="none"/>

        <rect x="0"   y="135" width="45" height="45" fill="none"/>
        <rect x="45"  y="135" width="45" height="45" fill="none"/>
        <rect x="90"  y="135" width="45" height="45" fill="none"/>
        <rect x="135" y="135" width="45" height="45" fill="none"/>
        <rect x="180" y="135" width="45" height="45" fill="none"/>

        <rect x="0"   y="180" width="45" height="45" fill="none"/>
        <rect x="45"  y="180" width="45" height="45" fill="none"/>
        <rect x="90"  y="180" width="45" height="45" fill="none"/>
        <rect x="135" y="180" width="45" height="45" fill="none"/>
        <rect x="180" y="180" width="45" height="45" fill="none"/>
      </g>

      <!-- numbers (simulating a vertical edge in the input) -->
      <text x="22.5"  y="28">0</text><text x="67.5"  y="28">0</text><text x="112.5" y="28">1</text><text x="157.5" y="28">1</text><text x="202.5" y="28">1</text>
      <text x="22.5"  y="73">0</text><text x="67.5"  y="73">0</text><text x="112.5" y="73">1</text><text x="157.5" y="73">1</text><text x="202.5" y="73">1</text>
      <text x="22.5"  y="118">0</text><text x="67.5"  y="118">0</text><text x="112.5" y="118">1</text><text x="157.5" y="118">1</text><text x="202.5" y="118">1</text>
      <text x="22.5"  y="163">0</text><text x="67.5"  y="163">0</text><text x="112.5" y="163">1</text><text x="157.5" y="163">1</text><text x="202.5" y="163">1</text>
      <text x="22.5"  y="208">0</text><text x="67.5"  y="208">0</text><text x="112.5" y="208">1</text><text x="157.5" y="208">1</text><text x="202.5" y="208">1</text>

      <!-- highlighted patch border on top -->
      <rect x="0" y="0" width="135" height="135" fill="none" stroke="#b45309" stroke-width="2.5"/>
    </g>

    <!-- label below input -->
    <text x="112" y="248" text-anchor="middle" font-size="11" fill="#6b7280">5×5 input (vertical edge)</text>
  </g>

  <!-- kernel for step 1 -->
  <g transform="translate(295, 130)">
    <text x="0" y="-8" font-size="12" fill="#6b7280" text-anchor="middle">3×3 kernel</text>
    <text x="0" y="6" font-size="12" fill="#6b7280" text-anchor="middle">(vertical edge detector)</text>

    <g transform="translate(-67.5, 22)" font-size="13" text-anchor="middle">
      <rect x="0"  y="0"  width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="45" y="0"  width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="90" y="0"  width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="0"  y="45" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="45" y="45" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="90" y="45" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="0"  y="90" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="45" y="90" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>
      <rect x="90" y="90" width="45" height="45" fill="#fff" stroke="#0369a1" stroke-width="1.4"/>

      <text x="22.5"  y="28" fill="#7a1f1c">-1</text><text x="67.5"  y="28">0</text><text x="112.5" y="28" fill="#14532d">+1</text>
      <text x="22.5"  y="73" fill="#7a1f1c">-1</text><text x="67.5"  y="73">0</text><text x="112.5" y="73" fill="#14532d">+1</text>
      <text x="22.5"  y="118" fill="#7a1f1c">-1</text><text x="67.5"  y="118">0</text><text x="112.5" y="118" fill="#14532d">+1</text>
    </g>
  </g>

  <!-- equals + output for step 1 -->
  <text x="445" y="190" text-anchor="middle" font-size="22" fill="#374151">=</text>

  <g transform="translate(475, 168)">
    <text x="22.5" y="-6" text-anchor="middle" font-size="11" fill="#6b7280">output[0,0]</text>
    <rect x="0" y="0" width="45" height="45" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="22.5" y="28" text-anchor="middle" font-size="14" fill="#111827">3</text>
  </g>

  <text x="497" y="240" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">(0×-1)+(0×0)+(1×1)+ …  = 3</text>

  <!-- ============================== STEP 2 ============================== -->
  <g transform="translate(540, 95)">
    <text x="0" y="-8" font-size="13" font-weight="600" fill="#1f2937">Step 2 — kernel slides right by two</text>

    <!-- 5x5 input grid -->
    <g font-size="14" fill="#111827" text-anchor="middle">
      <!-- highlighted patch (3x3 shifted to far right) -->
      <rect x="90"  y="0"  width="135" height="135" fill="#fef3c7" stroke="none"/>

      <!-- grid -->
      <g stroke="#cbd5e1" stroke-width="1">
        <rect x="0"   y="0"   width="45" height="45" fill="none"/>
        <rect x="45"  y="0"   width="45" height="45" fill="none"/>
        <rect x="90"  y="0"   width="45" height="45" fill="none"/>
        <rect x="135" y="0"   width="45" height="45" fill="none"/>
        <rect x="180" y="0"   width="45" height="45" fill="none"/>

        <rect x="0"   y="45"  width="45" height="45" fill="none"/>
        <rect x="45"  y="45"  width="45" height="45" fill="none"/>
        <rect x="90"  y="45"  width="45" height="45" fill="none"/>
        <rect x="135" y="45"  width="45" height="45" fill="none"/>
        <rect x="180" y="45"  width="45" height="45" fill="none"/>

        <rect x="0"   y="90"  width="45" height="45" fill="none"/>
        <rect x="45"  y="90"  width="45" height="45" fill="none"/>
        <rect x="90"  y="90"  width="45" height="45" fill="none"/>
        <rect x="135" y="90"  width="45" height="45" fill="none"/>
        <rect x="180" y="90"  width="45" height="45" fill="none"/>

        <rect x="0"   y="135" width="45" height="45" fill="none"/>
        <rect x="45"  y="135" width="45" height="45" fill="none"/>
        <rect x="90"  y="135" width="45" height="45" fill="none"/>
        <rect x="135" y="135" width="45" height="45" fill="none"/>
        <rect x="180" y="135" width="45" height="45" fill="none"/>

        <rect x="0"   y="180" width="45" height="45" fill="none"/>
        <rect x="45"  y="180" width="45" height="45" fill="none"/>
        <rect x="90"  y="180" width="45" height="45" fill="none"/>
        <rect x="135" y="180" width="45" height="45" fill="none"/>
        <rect x="180" y="180" width="45" height="45" fill="none"/>
      </g>

      <text x="22.5"  y="28">0</text><text x="67.5"  y="28">0</text><text x="112.5" y="28">1</text><text x="157.5" y="28">1</text><text x="202.5" y="28">1</text>
      <text x="22.5"  y="73">0</text><text x="67.5"  y="73">0</text><text x="112.5" y="73">1</text><text x="157.5" y="73">1</text><text x="202.5" y="73">1</text>
      <text x="22.5"  y="118">0</text><text x="67.5"  y="118">0</text><text x="112.5" y="118">1</text><text x="157.5" y="118">1</text><text x="202.5" y="118">1</text>
      <text x="22.5"  y="163">0</text><text x="67.5"  y="163">0</text><text x="112.5" y="163">1</text><text x="157.5" y="163">1</text><text x="202.5" y="163">1</text>
      <text x="22.5"  y="208">0</text><text x="67.5"  y="208">0</text><text x="112.5" y="208">1</text><text x="157.5" y="208">1</text><text x="202.5" y="208">1</text>

      <rect x="90" y="0" width="135" height="135" fill="none" stroke="#b45309" stroke-width="2.5"/>
    </g>

    <text x="112" y="248" text-anchor="middle" font-size="11" fill="#6b7280">same kernel, shifted further right</text>
  </g>

  <!-- equals + output for step 2 -->
  <text x="800" y="190" text-anchor="middle" font-size="22" fill="#374151">=</text>

  <g transform="translate(830, 168)">
    <text x="22.5" y="-6" text-anchor="middle" font-size="11" fill="#6b7280">output[0,2]</text>
    <rect x="0" y="0" width="45" height="45" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
    <text x="22.5" y="28" text-anchor="middle" font-size="14" fill="#111827">0</text>
  </g>

  <text x="852" y="240" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">(1×-1)+(1×0)+(1×1)+ …  = 0</text>

  <!-- ============================== TAKEAWAY ============================== -->
  <g transform="translate(450, 388)">
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="28" text-anchor="middle" font-size="13" fill="#1f2937"><tspan font-weight="600">Output[0,0] = 3</tspan> &#8202;—&#8202; the kernel detected an edge at the top-left position</text>
    <text x="0" y="50" text-anchor="middle" font-size="13" fill="#1f2937"><tspan font-weight="600">Output[0,2] = 0</tspan> &#8202;—&#8202; here the kernel sees all 1s, so the edge response cancels out</text>
    <text x="0" y="72" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">The same 9 numbers (the kernel) detect this pattern everywhere in the image — that's parameter sharing.</text>
  </g>
</svg>
