<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#fdfdfb"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">How a prediction becomes a TP, FP, or FN</text>
  <text x="450" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Every predicted box is matched to ground truth by IoU. The match decides which bucket it falls in.</text>

  <!-- ===== Panel 1: True Positive ===== -->
  <g transform="translate(40, 80)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#2d6a3f">True Positive (TP)</text>
    <rect x="0" y="14" width="240" height="180" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <!-- ground truth (solid green) -->
    <rect x="50" y="55" width="120" height="100" fill="none" stroke="#2b8a3e" stroke-width="3"/>
    <!-- prediction (dashed) overlapping well -->
    <rect x="65" y="68" width="120" height="100" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="7,4"/>
    <text x="120" y="210" text-anchor="middle" font-size="11.5" fill="#1f2937">IoU ≥ threshold, correct class</text>
    <text x="120" y="226" text-anchor="middle" font-size="11" fill="#6b7280">prediction overlaps a real object well</text>
  </g>

  <!-- ===== Panel 2: False Positive ===== -->
  <g transform="translate(330, 80)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#c0322b">False Positive (FP)</text>
    <rect x="0" y="14" width="240" height="180" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <!-- ground truth far away -->
    <rect x="30" y="50" width="70" height="60" fill="none" stroke="#2b8a3e" stroke-width="3"/>
    <!-- prediction with little/no overlap -->
    <rect x="130" y="95" width="90" height="80" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="7,4"/>
    <text x="120" y="210" text-anchor="middle" font-size="11.5" fill="#1f2937">IoU &lt; threshold (or wrong class,</text>
    <text x="120" y="226" text-anchor="middle" font-size="11.5" fill="#1f2937">or duplicate of an already-matched box)</text>
  </g>

  <!-- ===== Panel 3: False Negative ===== -->
  <g transform="translate(620, 80)">
    <text x="120" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#a05a0c">False Negative (FN)</text>
    <rect x="0" y="14" width="240" height="180" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <!-- ground truth, no prediction -->
    <rect x="60" y="55" width="120" height="100" fill="none" stroke="#2b8a3e" stroke-width="3"/>
    <text x="120" y="113" text-anchor="middle" font-size="28" fill="#adb5bd">?</text>
    <text x="120" y="210" text-anchor="middle" font-size="11.5" fill="#1f2937">A real object the model missed</text>
    <text x="120" y="226" text-anchor="middle" font-size="11" fill="#6b7280">no prediction matched this ground truth</text>
  </g>

  <!-- legend -->
  <g transform="translate(40, 320)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2b8a3e" stroke-width="3"/>
    <text x="50" y="4" font-size="12" fill="#1f2937">ground truth (the hand-labelled answer)</text>
    <line x1="320" y1="0" x2="360" y2="0" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="7,4"/>
    <text x="370" y="4" font-size="12" fill="#1f2937">model prediction</text>
  </g>

  <!-- the IoU reminder -->
  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="820" height="60" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1"/>
    <text x="16" y="24" font-size="12.5" fill="#1f2937" font-weight="600">IoU = area of overlap ÷ area of union.</text>
    <text x="16" y="44" font-size="12" fill="#495057">There is no "true negative" here — an image has unlimited places a box could have been but wasn't, so you cannot count correct absences. That is exactly why detection has no ROC curve (more in Section 7).</text>
  </g>
</svg>
